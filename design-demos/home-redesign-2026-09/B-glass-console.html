<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시안 B · 글래스 관제실</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F172A;--fg:#F8FAFC;--muted:#94A3B8;--muted-2:#64748B;--line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.18);
  --card:rgba(255,255,255,.055);--card-2:rgba(255,255,255,.09);
  --green:#22C55E;--blue:#60A5FA;--purple:#A78BFA;--amber:#FBBF24;--red:#F87171;--pink:#F472B6;--cyan:#22D3EE;
  --claude:#F0946B;--codex:#34D399;
  --sans:"Inter","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--mono:"JetBrains Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(420px 320px at 8% -4%,rgba(167,139,250,.35),transparent 60%),
  radial-gradient(380px 300px at 100% 10%,rgba(96,165,250,.28),transparent 60%),
  radial-gradient(360px 280px at 60% 110%,rgba(34,197,94,.22),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
.glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.top{position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;gap:6px;padding:0 6px 0 16px;background:rgba(15,23,42,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top .brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.top .brand .lg{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 0 18px rgba(167,139,250,.45)}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:12px;color:var(--fg)}
.ib:active{background:var(--card-2)}
main{padding:14px 14px 0}
/* 벤토: PC 상태 + 사용량 */
.bento{display:grid;grid-template-columns:1.25fr 1fr;grid-auto-rows:auto;gap:10px}
.pc{grid-row:span 2;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pc .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.pc .h i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.pc .sub{font-size:12px;color:var(--muted)}
.gauges{display:flex;gap:10px;margin-top:auto}
.gauge{flex:1;display:flex;flex-direction:column;gap:6px}
.gauge .l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.gauge .l b{color:var(--fg);font-weight:500}
.gauge .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.gauge .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--blue))}
.gauge.mem .bar i{background:linear-gradient(90deg,var(--purple),var(--pink))}
.lim{border-radius:16px;padding:11px 12px;display:flex;flex-direction:column;gap:5px;text-align:left}
.lim .l{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.lim .l b{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--fg)}
.lim .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.lim .bar i{display:block;height:100%;background:var(--green)}
.lim.warm .l b{color:var(--amber)}.lim.warm .bar i{background:var(--amber)}
/* 오늘 요약 띠 */
.today{margin-top:10px;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);width:100%;text-align:left}
.today b{color:var(--fg);font-weight:600}
.today .tag{font-family:var(--mono);font-size:11px;color:var(--purple);padding:2px 7px;border-radius:6px;background:rgba(167,139,250,.15)}
.today svg{margin-left:auto;color:var(--muted-2)}
/* 세그먼트 필터 */
.seg{margin-top:12px;display:grid;grid-template-columns:repeat(5,1fr);padding:4px;border-radius:14px}
.seg button{height:40px;border:0;background:none;border-radius:10px;font-size:12px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.seg button b{font-family:var(--mono);font-size:13px;color:var(--c,var(--fg))}
.seg button.on{background:var(--card-2);color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.seg .attn{--c:var(--amber)}.seg .work{--c:var(--blue)}.seg .done{--c:var(--green)}.seg .err{--c:var(--red)}
/* 워크스페이스 */
.ws{margin-top:16px;display:flex;align-items:center;gap:8px;padding:0 2px}
.ws .name{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;display:flex;flex-direction:column}
.ws .name strong{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws .name strong .pin{color:var(--amber)}
.ws .name small{font-family:var(--mono);font-size:11px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws .name small .gh{color:var(--cyan)}
.ws .acts{display:flex;border-radius:12px;overflow:hidden}
.ws .acts button{height:40px;min-width:44px;padding:0 12px;border:0;background:none;font-size:13px;font-weight:600;color:var(--fg);display:inline-flex;align-items:center;justify-content:center}
.ws .acts button+button{border-left:1px solid var(--line)}
.ws .acts button:active{background:var(--card-2)}
.cards{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.card{border-radius:16px;padding:12px 12px 12px 14px;display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;position:relative;overflow:hidden;text-align:left;width:100%}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.card .av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.02em}
.card .av.claude{background:rgba(240,148,107,.16);color:var(--claude)}
.card .av.codex{background:rgba(52,211,153,.16);color:var(--codex)}
.card .b{min-width:0}
.card .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card .m{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.card .st{font-size:11px;font-weight:600;color:var(--c);padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.card .st i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.card time{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.card.attn{--c:var(--amber);background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.35)}
.card.work{--c:var(--blue)}.card.done{--c:var(--green)}.card.err{--c:var(--red);background:rgba(248,113,113,.06)}
.ws.closed{padding:12px 14px;border-radius:16px}
.ws.closed .name small{font-family:var(--sans);font-size:12px;color:var(--muted)}
.pad{height:calc(120px + env(safe-area-inset-bottom))}
/* 하단 탭바 + 기본 동작 */
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(96,165,250,.4);z-index:6}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));height:62px;border-radius:20px;display:grid;grid-template-columns:repeat(4,1fr);z-index:6;background:rgba(15,23,42,.78)}
.tabs button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.tabs button.on{color:var(--fg)}
.tabs button.on::after{content:"";position:absolute;bottom:6px;width:16px;height:3px;border-radius:3px;background:var(--cyan)}
.tabs .bd{position:absolute;top:8px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--amber);color:#1a1200;font-family:var(--mono);font-size:10px;font-weight:600;display:grid;place-items:center}
</style></head><body>
<header class="top">
  <div class="brand"><span class="lg"></span><span>SmartAgent</span></div>
  <button class="ib" aria-label="새로고침"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
  <button class="ib" aria-label="설정"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg></button>
</header>
<main>
  <div class="bento">
    <div class="pc glass">
      <div class="h"><i></i>DESKTOP-LEE</div>
      <div class="sub">Windows PC · 동기화 방금</div>
      <div class="gauges">
        <div class="gauge"><div class="l">CPU <b>23%</b></div><div class="bar"><i style="width:23%"></i></div></div>
        <div class="gauge mem"><div class="l">RAM <b>61%</b></div><div class="bar"><i style="width:61%"></i></div></div>
      </div>
    </div>
    <button class="lim glass"><div class="l">5시간 한도 <b>34%</b></div><div class="bar"><i style="width:34%"></i></div></button>
    <button class="lim glass warm"><div class="l">주간 한도 <b>72%</b></div><div class="bar"><i style="width:72%"></i></div></button>
  </div>
  <button class="today glass"><span class="tag">TODAY</span><span><b>완료 4</b> · 승인 대기 1 · 오류 1</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>

  <div class="seg glass" role="tablist">
    <button class="on">전체<b>6</b></button><button class="attn">승인<b>1</b></button><button class="work">작업<b>2</b></button><button class="done">완료<b>2</b></button><button class="err">오류<b>1</b></button>
  </div>

  <div class="ws">
    <button class="name"><strong><svg class="pin" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.9l-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z"/></svg>leebeegle_SmartAgent</strong><small><span class="gh">lucky-tstore/leebeegle_SmartAgent</span> · master</small></button>
    <div class="acts glass"><button>커밋</button><button aria-label="에이전트 추가"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button aria-label="접기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button></div>
  </div>
  <div class="cards">
    <button class="card glass attn"><span class="av claude">CL</span><span class="b"><div class="t">홈화면 개편</div><div class="s">승인 1건 대기 중 · style.css 수정 요청</div></span><span class="m"><span class="st"><i></i>승인 필요</span><time>방금</time></span></button>
    <button class="card glass work"><span class="av codex">CX</span><span class="b"><div class="t">스크롤 버그 수정</div><div class="s">app.js 수정하는 중 · 대기 1건</div></span><span class="m"><span class="st"><i></i>작업 중</span><time>3분 전</time></span></button>
    <button class="card glass done"><span class="av claude">CL</span><span class="b"><div class="t">텔레그램 연동</div><div class="s">네, 처리했습니다. 이제 텔레그램으로도 승인할 수 있습니다.</div></span><span class="m"><span class="st"><i></i>완료</span><time>2시간 전</time></span></button>
  </div>

  <div class="ws">
    <button class="name"><strong>youtube-factory</strong><small>~/Desktop/youtube-factory · GitHub 미연결</small></button>
    <div class="acts glass"><button>커밋</button><button aria-label="에이전트 추가"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button aria-label="접기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button></div>
  </div>
  <div class="cards">
    <button class="card glass work"><span class="av claude">CL</span><span class="b"><div class="t">쇼츠 영상 생성</div><div class="s">배경 작업 render-shorts · 영상 렌더링 중</div></span><span class="m"><span class="st"><i></i>작업 중</span><time>12분 전</time></span></button>
    <button class="card glass err"><span class="av codex">CX</span><span class="b"><div class="t">썸네일 만들기</div><div class="s">ffmpeg를 찾을 수 없습니다</div></span><span class="m"><span class="st"><i></i>오류</span><time>1시간 전</time></span></button>
  </div>

  <div class="ws closed glass">
    <button class="name"><strong>shop-landing</strong><small>에이전트 1 · 완료 1</small></button>
    <div class="acts"><button aria-label="펼치기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
  </div>
  <div class="pad"></div>
</main>

<button class="fab" aria-label="프로젝트 추가"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs glass">
  <button class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button><span class="bd">1</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>승인</button>
  <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>작업</button>
  <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>설정</button>
</nav>
</body></html>
