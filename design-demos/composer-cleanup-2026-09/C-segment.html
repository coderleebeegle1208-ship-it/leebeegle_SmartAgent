<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C — 세그먼트 바 + 한 줄 파이프라인</title>
<style>
:root {
  --bg: #FFFFFF;
  --surface: #F7F8F8;
  --surface-2: #EEF0F2;
  --line: #E6E8EB;
  --line-strong: #D5D8DC;
  --ink: #0F1011;
  --ink-2: #3C3F44;
  --ink-3: #6B6F76;
  --ink-4: #8A8F98;
  --accent: #5E6AD2;
  --accent-ink: #4A56B8;
  --accent-bg: #ECEEFA;
  --sans: "Inter", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r-s: 6px; --r-m: 8px; --r-l: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #F3F4F5; font-family: var(--sans); }
.frame { position: relative; width: 390px; height: 700px; margin: 20px auto; background: var(--bg); overflow: hidden; }
.topbar { height: 44px; display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink); }
.label { position: absolute; top: 6px; left: 14px; font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); padding: 3px 8px; border-radius: 999px; z-index: 9; }
.msgs { padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 82%; padding: 10px 13px; border-radius: 14px; font-size: 13px; line-height: 1.5; }
.bubble.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.bubble.agent { align-self: flex-start; background: var(--surface); color: var(--ink-2); border-bottom-left-radius: 4px; }

/* --- composer: C. segmented bar + one-line pipeline --- */
.composer { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 14px; background: var(--bg); border-top: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 8px; padding: 0 1px 8px; }
.segment { flex: 1; min-width: 0; display: flex; height: 32px; border-radius: 999px; border: 1px solid var(--line-strong); overflow: hidden; }
.segment button { flex: 1; min-width: 0; border: 0; background: var(--bg); color: var(--ink-2); font-size: 12px; font-weight: 600; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid var(--line); }
.segment button:last-child { border-right: 0; }
.review { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 8px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.review .sw { width: 26px; height: 16px; border-radius: 999px; background: var(--line-strong); position: relative; }
.review .sw::before { content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; }
.ring { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
.ring i { width: 17px; height: 17px; border-radius: 50%; background: conic-gradient(var(--accent) 34%, var(--line-strong) 0); display:block; position:relative; }
.ring i::after { content:""; position:absolute; inset: 3px; border-radius: 50%; background: var(--bg); }

.pipeline-line { padding: 0 4px 8px; font-size: 12px; white-space: nowrap; overflow-x: auto; }
.pipeline-line .m { color: var(--ink); font-weight: 600; }
.pipeline-line .k { color: var(--ink-3); }
.pipeline-line .e { color: var(--accent-ink); font-weight: 600; }
.pipeline-line .sep { color: var(--ink-4); margin: 0 6px; }

.inputrow { display: flex; align-items: center; gap: 8px; }
.plus { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink-3); font-size: 17px; display: grid; place-items: center; }
.field { flex: 1; min-width: 0; position: relative; }
.field textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line-strong); outline: 0; resize: none; border-radius: 999px; padding: 11px 46px 11px 16px; font-size: 15px; line-height: 1.4; color: var(--ink); background: var(--bg); font-family: var(--sans); min-height: 40px; }
.field textarea::placeholder { color: var(--ink-4); }
.field .send { position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; }
.field .send svg { width: 15px; height: 15px; }
</style>
</head>
<body>
<div class="frame">
  <span class="label">C — 세그먼트 바 + 한 줄 파이프라인</span>
  <div class="topbar">스마트에이전트</div>
  <div class="msgs">
    <div class="bubble user">로그인 화면 여백 좀 넓혀줘</div>
    <div class="bubble agent">네, 상단·하단 여백을 16px씩 늘렸습니다. 확인해 주세요.</div>
  </div>
  <div class="composer">
    <div class="top-row">
      <div class="segment">
        <button>Claude</button>
        <button>권한 자동</button>
        <button>교차 모델</button>
      </div>
      <label class="review"><span>검토</span><span class="sw"></span></label>
      <div class="ring"><i></i></div>
    </div>
    <div class="pipeline-line">
      <span class="k">판단</span> <span class="m">Haiku 4.5</span>
      <span class="sep">·</span>
      <span class="k">계획</span> <span class="m">Opus 5</span> <span class="e">높음</span>
      <span class="sep">·</span>
      <span class="k">실행</span> <span class="m">Sonnet 5</span> <span class="e">기본</span>
    </div>
    <div class="inputrow">
      <button class="plus">+</button>
      <div class="field">
        <textarea rows="1" placeholder="지시를 입력하세요…"></textarea>
        <button class="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
