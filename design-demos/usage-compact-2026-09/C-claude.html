<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C — Claude 앱 요약 스트립</title>
<style>
:root {
  --bg: #FFFFFF;
  --surface: #F7F8F8;
  --surface-2: #EEF0F2;
  --line: #E6E8EB;
  --line-strong: #D5D8DC;
  --ink: #0F1011;
  --ink-2: #3C3F44;
  --ink-3: #6B6F76;
  --ink-4: #8A8F98;
  --accent: #5E6AD2;
  --accent-ink: #4A56B8;
  --accent-bg: #ECEEFA;
  --attn: #F2994A;
  --attn-ink: #9A3E0F;
  --attn-bg: #FFF3E8;
  --ok: #4CB782;
  --ok-ink: #2A6E4E;
  --ok-bg: #E6F4EC;
  --warn: #D9A521;
  --warn-ink: #7A5A06;
  --danger: #B42318;
  --danger-bg: #FDECEA;
  --sans: "Inter", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --r-s: 6px; --r-m: 8px; --r-l: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #F3F4F5; font-family: var(--sans); color: var(--ink); }
.frame { position: relative; width: 390px; height: 700px; margin: 20px auto; background: var(--bg); overflow: hidden; }
.label { position: absolute; top: 6px; left: 14px; font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); padding: 3px 9px; border-radius: 999px; z-index: 9; }
.topbar { height: 52px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 600; letter-spacing: -.01em; }

/* ---- .pc (unchanged from app) ---- */
.pc { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.pc .h { grid-column: 1; font-size: 15px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; min-width: 0; }
.pc .h em { font-style: normal; font-weight: 500; font-size: 12px; color: var(--ok-ink); background: var(--ok-bg); padding: 2px 7px; border-radius: 999px; }
.pc .stat { grid-column: 2; grid-row: 1 / 3; align-self: center; font-family: var(--mono); font-size: 12px; color: var(--ink-3); display: flex; gap: 12px; }
.pc .stat b { color: var(--ink); font-weight: 500; }
.pc .sub { grid-column: 1; font-size: 12px; color: var(--ink-3); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- C: Claude-style summary strip ---- */
.usage-strip { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
.usage-ring { --usage-pct: 0; --ring-color: var(--accent); position: relative; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.usage-ring::before { content: ""; width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(var(--ring-color) calc(var(--usage-pct) * 1%), var(--line-strong) 0); }
.usage-ring::after { content: ""; position: absolute; width: 21px; height: 21px; border-radius: 50%; background: var(--bg); }
.usage-strip-text { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usage-strip-text b { font-weight: 600; color: var(--ink); font-family: var(--mono); }
.usage-strip-text b.hot { color: var(--attn-ink); }
.usage-strip-more { flex: 0 0 auto; height: 30px; padding: 0 8px; border: 0; background: none; color: var(--accent-ink); font-size: 12px; font-weight: 600; }

/* ---- rail + list (context only) ---- */
.rail { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.chip { height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--bg); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip b { font-weight: 600; }
.sect { display: flex; flex-direction: column; gap: 2px; padding: 8px 16px 7px; background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.sect strong { font-size: 14px; font-weight: 600; }
.sect small { font-family: var(--mono); font-size: 11px; color: var(--ink-4); }
.row { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: start; padding: 12px 16px; min-height: 44px; border-bottom: 1px solid var(--line); }
.row .g { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-4); margin-top: 6px; }
.row.attn { background: var(--attn-bg); }
.row.attn .g { background: var(--attn); }
.row .t { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .t strong { font-size: 15px; font-weight: 500; }
.kind { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--accent-ink); background: var(--accent-bg); padding: 2px 6px; border-radius: 4px; }
.state { font-size: 12px; color: var(--ink-3); }
.state.attn { color: var(--attn-ink); font-weight: 600; }
.row .s { font-size: 13px; color: var(--ink-3); margin-top: 3px; }
.row.attn .s { color: var(--attn-ink); font-weight: 500; }
.row .m { font-size: 12px; color: var(--ink-3); padding-top: 3px; }
</style>
</head>
<body>

<div class="frame">
  <span class="label">C — Claude 앱 요약 스트립</span>
  <div class="topbar">leebeegle_SmartAgent</div>
  <div class="pc">
    <div class="h">leebeegle <em>Connected</em></div>
    <div class="sub">Windows PC · 마지막 동기화 2분 전</div>
    <div class="stat"><span>CPU <b>3%</b></span><span>RAM <b>34%</b></span></div>
  </div>
  <div class="usage-strip">
    <div class="usage-ring" style="--usage-pct:0"></div>
    <div class="usage-strip-text">5시간 <b>0%</b> · 주간 <b>68%</b> · Fable <b class="hot">100%</b></div>
    <button class="usage-strip-more">자세히</button>
  </div>
  <div class="rail">
    <button class="chip on">전체 <b>6</b></button>
    <button class="chip">승인 필요 <b>1</b></button>
    <button class="chip">작업 중 <b>2</b></button>
    <button class="chip">완료 <b>3</b></button>
  </div>
  <div class="sect"><strong>leebeegle_SmartAgent</strong><small>~/Desktop/leebeegle_SmartAgent</small></div>
  <div class="row attn">
    <div class="g"></div>
    <div style="min-width:0">
      <div class="t"><span class="kind">Claude</span><strong>디자인 정리</strong><span class="state attn">승인 필요</span></div>
      <div class="s">승인 1건 대기 중</div>
    </div>
    <div class="m">2분 전</div>
  </div>
  <div class="row">
    <div class="g"></div>
    <div style="min-width:0">
      <div class="t"><span class="kind">Claude</span><strong>로그인 화면</strong><span class="state">작업 중</span></div>
      <div class="s">여백 조정 중입니다…</div>
    </div>
    <div class="m">방금</div>
  </div>
</div>

</body>
</html>
